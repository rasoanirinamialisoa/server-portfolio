nelmio_cors:
    defaults:
        allow_origin: ['https://portfolio-lisa-mialy.netlify.app', 'http://localhost:3000', 'http://localhost:5173']
        allow_methods: ['GET', 'OPTIONS', 'POST', 'PUT', 'DELETE']
        allow_headers: ['Content-Type', 'Authorization']
        max_age: 3600
    paths:
        '^/api/':
            allow_origin: ['https://portfolio-lisa-mialy.netlify.app', 'http://localhost:3000', 'http://localhost:5173']
            allow_headers: ['Content-Type', 'Authorization']
            allow_methods: ['POST', 'GET', 'OPTIONS', 'PUT', 'DELETE']
            max_age: 3600